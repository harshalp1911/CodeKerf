services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      # Turns on production checks, such as refusing to start without JWT_SECRET
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/online-code-editor
      - REDIS_URL=redis://redis:6379
      # Requests reach the server through the client's nginx, which adds X-Forwarded-For
      - TRUST_PROXY=1
    ports:
      - "5001:5002"
    depends_on:
      - mongo
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp

  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: